# /etc/nginx/conf.d/ssl_params.conf

ssl_certificate /etc/nginx/certs/nginx.crt;
ssl_certificate_key /etc/nginx/certs/nginx.key;

# 推荐的 SSL 安全设置
ssl_protocols TLSv1.3;
ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';

# TLS 1.2 兼顾仍在支持期内的旧客户端，TLS 1.3 用于现代客户端。
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_prefer_server_ciphers off;

# 复用 TLS 会话，降低重复握手开销；关闭 session ticket 避免密钥轮换风险。
ssl_session_cache shared:AICC_TLS:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_buffer_size 4k;

# 通用安全响应头。HSTS 应在正式域名全量启用 HTTPS 后单独开启。
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 启用 SNI 支持，这对于 HTTPS 代理至关重要
proxy_ssl_server_name on;

